name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env: {POSTGRES_USER: rah, POSTGRES_PASSWORD: test, POSTGRES_DB: rah_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rah" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rah:test@localhost:5432/rah_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --legacy-peer-deps && npm test && npm run build
        working-directory: web
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/agent && GOOS=linux GOARCH=arm64 go build ./cmd/agent
      - run: |
          for script in bootstrap.sh install.sh rah.sh scripts/*.sh; do bash -n "$script"; done
          bash scripts/test-install.sh
          bash scripts/test-bootstrap.sh
          bash scripts/test-restore.sh
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t rahpanel:local .
      - name: Generate isolated deployment secrets
        run: docker run --rm --entrypoint /app/rahctl -u "$(id -u):$(id -g)" -v "$PWD:/output" rahpanel:local init --domain panel.example.test --dir /output
      - name: Validate and start the complete stack
        run: |
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T panel /app/rahctl healthcheck
          docker compose exec -T edge wget -q -O /dev/null http://panel:8080/healthz
      - name: Verify data survives recreation
        run: |
          docker compose exec -T db psql -U rah -d rah -v ON_ERROR_STOP=1 -c "CREATE TABLE docker_smoke(value text); INSERT INTO docker_smoke VALUES ('persisted');"
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 180
          test "$(docker compose exec -T db psql -U rah -d rah -Atc 'SELECT value FROM docker_smoke')" = persisted
      - name: Diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --tail 100
      - name: Clean up
        if: always()
        run: docker compose down --volumes
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker-smoke]
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: rahpanel-production
      cancel-in-progress: false
    steps:
      - name: Update the production panel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}" "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/key" -l "$DEPLOY_USER" -- "$DEPLOY_HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/rahpanel
          git fetch origin refs/heads/main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$1" ]]; then
            echo 'main has advanced since this run. Skipping deployment.'
            exit 0
          fi
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=no)"
          git merge --ff-only "$1"
          test "$(git rev-parse HEAD)" = "$1"
          bash rah.sh update
          docker compose exec -T panel /app/rahctl healthcheck
          REMOTE
